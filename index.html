<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Painel Administrativo
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{

      background:#0f172a;
      color:#fff;
      padding:20px;
    }

    h1{

      margin-bottom:30px;
      font-size:35px;
    }

    .cliente{

      background:#1e293b;

      padding:20px;

      border-radius:20px;

      margin-bottom:20px;

      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:20px;

      flex-wrap:wrap;
    }

    .info h3{

      font-size:22px;
      margin-bottom:10px;
    }

    .info small{

      color:#cbd5e1;
    }

    .acoes{

      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{

      border:none;

      padding:12px 18px;

      border-radius:12px;

      cursor:pointer;

      color:#fff;

      font-weight:bold;
    }

    .bloquear{

      background:#ef4444;
    }

    .liberar{

      background:#10b981;
    }

    .renovar{

      background:#2563eb;
    }

    .atrasado{

      color:#ef4444;

      font-weight:bold;

      display:block;

      margin-top:10px;
    }

    .ativo{

      color:#10b981;

      font-weight:bold;

      display:block;

      margin-top:10px;
    }

    .bloqueado{

      color:#f97316;

      font-weight:bold;

      display:block;

      margin-top:10px;
    }

  </style>

</head>

<body>

  <h1>
    Painel Administrativo
  </h1>

  <div id="clientes"></div>

  <script src="admin.js"></script>

</body>
</html>
